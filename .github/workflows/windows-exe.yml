name: Build Windows EXE

# Builds the Music ConnectZ desktop installer (Electron) on a Windows runner and
# publishes it to the "exe-latest" GitHub Release, so the OnboardZ "Download for
# Windows" button always points at a fresh installer. The desktop shell loads the
# live site, so it doesn't depend on the web build here.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/windows-exe.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Two files from one build. The installer is the one that puts Music
      # ConnectZ on the desktop and in the Start menu; the portable exe is for
      # anyone who wants to run it off a stick without installing anything, and
      # for the case where an installer is what a locked-down machine refuses.
      - name: Build Windows installer and portable exe
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never

      - name: Collect the builds
        shell: bash
        run: |
          cp desktop/dist/MusicConnectZ-Setup.exe "$GITHUB_WORKSPACE/MusicConnectZ-Setup.exe"
          cp desktop/dist/MusicConnectZ.exe "$GITHUB_WORKSPACE/MusicConnectZ.exe"

      # The Microsoft Store takes the installer by URL and wants one that names its
      # version and never changes underneath a submission. exe-latest is rebuilt on
      # every push, so each desktop version also gets its own release, written once:
      # bump "version" in desktop/package.json to publish the next one.
      - name: Read the desktop version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish the versioned release (the Store's package URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-v${{ steps.ver.outputs.v }}
          name: Music ConnectZ for Windows ${{ steps.ver.outputs.v }}
          body: |
            Version ${{ steps.ver.outputs.v }}, built from ${{ github.sha }}.
            Silent install: `MusicConnectZ-Setup.exe /S`
          files: MusicConnectZ-Setup.exe

      # Partner Center refuses a package URL that redirects, and every GitHub release
      # download does. So the same installer is also committed, once per version, to
      # the orphan `downloads` branch; raw.githubusercontent.com serves that with no
      # redirect, and vercel.json puts it at musicconnectz.net/downloads/<version>/.
      # Written once: a version already there is left alone, because the Store wants
      # the file behind a submitted URL never to change.
      - name: Publish the installer to the downloads branch (no-redirect URL)
        shell: bash
        env:
          V: ${{ steps.ver.outputs.v }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work="$RUNNER_TEMP/downloads"
          if git ls-remote --exit-code origin refs/heads/downloads >/dev/null 2>&1; then
            git clone --depth 1 --branch downloads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          else
            mkdir -p "$work" && cd "$work" && git init -q -b downloads
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd "$GITHUB_WORKSPACE"
          fi
          cd "$work"
          if [ -f "$V/MusicConnectZ-Setup.exe" ]; then
            echo "Version $V is already published; left as it is."
            exit 0
          fi
          mkdir -p "$V"
          cp "$GITHUB_WORKSPACE/MusicConnectZ-Setup.exe" "$V/MusicConnectZ-Setup.exe"
          git add "$V/MusicConnectZ-Setup.exe"
          git commit -q -m "Music ConnectZ for Windows $V"
          git push -q origin downloads

      - name: Publish to the exe-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: Music ConnectZ — Windows installer
          body: |
            Auto-built from ${{ github.sha }}.

            * **MusicConnectZ-Setup.exe** — the installer. Puts Music ConnectZ on your
              desktop and in the Start menu.
            * **MusicConnectZ.exe** — one file, installs nothing. Run it from anywhere.

            Neither is code-signed yet, so SmartScreen shows "unrecognised app" on
            first run: **More info → Run anyway**.
          files: |
            MusicConnectZ-Setup.exe
            MusicConnectZ.exe

name: Build Android APK

# Builds a debug APK from the Vite app via Capacitor and publishes it to the
# "apk-latest" GitHub Release, so the OnboardZ "Download the app" button always
# points at a fresh build. Runs on pushes to main (that touch the app) and on
# demand. Debug APK is unsigned/sideloadable — good for direct download; a
# Play Store build would add signing + `assembleRelease`.
on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "capacitor.config.json", "package.json", "resources/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      # Explicit packages, deliberately excluding the default list this action
      # falls back to when `packages` is omitted — that list includes the
      # legacy "tools" package, which Google has removed from the SDK
      # repository entirely. `sdkmanager tools` then fails with "Failed to
      # find package 'tools'" (exit 1) before anything Android-specific ever
      # runs — this broke every build on main for two pushes running, unable
      # to get as far as `cap add android`. What Capacitor 6's Gradle project
      # (compileSdk/targetSdk 34) actually needs is platform-tools, the
      # platform, and one build-tools release; none of those is "tools".
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Add Android platform
        run: npx --yes cap add android

      - name: Generate app icon + splash from the logo
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor "#07060d" --splashBackgroundColor "#07060d" || echo "asset gen skipped"

      - name: Sync web assets into Android
        run: npx --yes cap sync android

      # A fresh runner generates a fresh ~/.android/debug.keystore, so every
      # build was signed by a different key and Android refused to install it
      # over the previous one ("App not installed") — every update meant an
      # uninstall. The key lives in a secret, not the repo: this repo is
      # public, and a committed key would let anyone sign an "update" that
      # installs over a member's copy.
      - name: Use the fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set — this APK gets a throwaway key and will not install over the previous build."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MusicConnectZ.apk"

      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Music ConnectZ — latest APK
          body: "Auto-built debug APK. Sideload on Android (allow installs from this source). Built from ${{ github.sha }}."
          files: MusicConnectZ.apk

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Boot watchdog. Everything else in this app that can fail renders a
         message, but only after React is running — so an entry bundle that
         never loads (a cached index naming a file the last deploy deleted,
         which the SPA rewrite answers with index.html and the browser refuses
         as a module) left a silent, empty screen. In the APK that is a black
         page with no address bar and no way out. Classic inline script, so it
         runs during parse and is listening before the deferred module fails. -->
    <script>
      (function () {
        var KEY = "mcz_chunk_reload_at", COOLDOWN = 30000, SLOW_MS = 15000, shown = false;
        function recent() {
          try { var at = +(sessionStorage.getItem(KEY) || 0); return at > 0 && Date.now() - at < COOLDOWN; }
          catch (e) { return true; }
        }
        function booted() { var r = document.getElementById("root"); return !!(r && r.firstChild); }
        function show(why) {
          if (shown || booted() || !document.body) return;
          shown = true;
          var d = document.createElement("div");
          d.id = "mcz-boot-fail";
          d.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#07060d;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center";
          d.innerHTML = '<strong style="font-size:20px">Music ConnectZ didn\'t load</strong>' +
            '<span style="color:rgba(255,255,255,.65);max-width:320px"></span>' +
            '<button style="padding:12px 28px;border:0;border-radius:12px;background:#a855f7;color:#fff;font-weight:700;font-size:16px">Reload</button>';
          d.querySelector("span").textContent = why;
          d.querySelector("button").onclick = function () {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
            location.reload();
          };
          document.body.appendChild(d);
          var r = document.getElementById("root");
          if (r && window.MutationObserver) new MutationObserver(function (_, o) {
            if (booted()) { d.remove(); o.disconnect(); }
          }).observe(r, { childList: true });
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          if (navigator.onLine === false) return show("You're offline. Reconnect, then reload.");
          if (!recent()) {
            try { sessionStorage.setItem(KEY, String(Date.now())); location.reload(); return; } catch (x) {}
          }
          show("A new version shipped while this one was open, or the connection dropped mid-load.");
        }, true);
        setTimeout(function () {
          show(navigator.onLine === false ? "You're offline. Reconnect, then reload."
            : "It's taking longer than it should. Reload to try again.");
        }, SLOW_MS);
      })();
    </script>

    <!-- seo:start -->
    <!-- ─── What a crawler actually gets ───────────────────────────────────
         This file IS the site as far as anything that doesn't run JavaScript
         is concerned: the app renders into #root at runtime, so a fetch of
         any route returns this markup and nothing else. Google executes JS
         and eventually sees the app; most AI crawlers (GPTBot, ClaudeBot,
         PerplexityBot) do not, and neither do link unfurlers. So everything
         below has to say what this place is without the app's help. -->
    <title>Music ConnectZ — AI Vocal &amp; Rap Coach, Collabs, Paid Gigs</title>
    <meta
      name="description"
      content="Train your voice, body, or bars with an AI coach that listens and scores pitch, timing and delivery. Post tracks, collaborate, get paid. Free scored take, no account needed."
    />
    <link rel="canonical" href="https://musicconnectz.net/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta name="author" content="Corey Knap" />
    <meta name="copyright" content="© 2026 Corey Knap. All rights reserved." />
    <meta name="theme-color" content="#a855f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Music ConnectZ" />

    <link rel="icon" type="image/png" href="/favicon-v5.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews: every share of this domain used to unfurl as a bare
         URL with no image, because there were no OG tags at all. -->

    <meta property="og:site_name" content="Music ConnectZ" />
    <meta property="og:url" content="https://musicconnectz.net/" />

    <meta
      property="og:description"

    />
    <meta property="og:image" content="https://musicconnectz.net/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Music ConnectZ — Connect Through Music" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Music ConnectZ — Connect Through Music" />
    <meta
      name="twitter:description"
      content="Train your voice, body, or bars with an AI coach that listens and scores. Post tracks, collaborate, get paid. Free scored take, no account needed."
    />
    <meta name="twitter:image" content="https://musicconnectz.net/og-card.png" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data. This is the part an answer engine reads when it is
         deciding what to say about this place, and it is the only structured
         description of the product that exists outside the app. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://musicconnectz.net/#org",
            "name": "Music ConnectZ",
            "url": "https://musicconnectz.net/",
            "logo": "https://musicconnectz.net/logo.png",
            "slogan": "Connect Through Music",
            "founder": { "@type": "Person", "name": "Corey Knap" },
            "sameAs": ["https://www.instagram.com/musicconnectz/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://musicconnectz.net/#site",
            "url": "https://musicconnectz.net/",
            "name": "Music ConnectZ",
            "publisher": { "@id": "https://musicconnectz.net/#org" },
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "name": "Music ConnectZ",
            "url": "https://musicconnectz.net/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web, Android",
            "publisher": { "@id": "https://musicconnectz.net/#org" },
            "description": "A gamified platform for musicians and athletes: AI vocal, rap and body coaching with real scoring, track posting, collaboration deals, playlists and paid work.",
            "featureList": [
              "AI vocal coaching scored on pitch, tone, breath, range and agility",

              "Lessons, battles and paid creative work"
            ],

              "price": "0",
              "priceCurrency": "USD",
              "description": "Free tier with a daily allowance of AI coaching prompts."
            }
          }
        ]
      }

  <body>
    <div id="root"></div>
    <!-- Not a trick, and not keywords: this is what someone with JavaScript
         off actually gets, and it should be true and useful to them. It is
         also what a non-rendering crawler reads, which is why it says the
         same things the app says rather than a different, better story. -->
    <noscript>
      <h1>Music ConnectZ — Connect Through Music</h1>
      <p><strong>Meet you where you are, then take you farther.</strong></p>
      <p>
        Music ConnectZ is a platform for musicians. An AI coach listens to the
        take you actually recorded and scores it — pitch, tone, breath, range
        and agility for singing; flow, timing, breath, clarity and delivery for
        rap — then tells you what worked, what to fix, and one drill to run
        before the next take.
      </p>
      <p>
        Around that: post your tracks, videos, covers and lyrics; start
        collaboration deals that credit everyone who worked on the record;
        build playlists across Music ConnectZ and outside distributors; book
        lessons; and get paid for creative work.
      </p>
      <p>
        <strong>You can try the coach without an account.</strong>
        <a href="/try/singz">Get a free scored singing take</a>,
        <a href="/try/rapz">a free scored rap take</a>, or
        <a href="/try/bodiez">log a free exercise with BodieZ</a> — one per day, no sign-up.
      </p>
      <p>
        Music ConnectZ needs JavaScript to run. Please enable it, or install the
        Android app.
      </p>
      <p>
        <a href="/privacy.html">Privacy Policy</a> ·
        <a href="/terms.html">TermZ</a> ·
        <a href="/partners.html">Partners</a> ·
        <!-- The same account the Organization graph claims in sameAs. A
             crawler reading a structured claim and then finding the link that
             backs it is a stronger signal than the claim on its own — and it
             is the only way a JavaScript-off visitor can find us anywhere
             else, which is the reason this block exists at all. -->
        <a href="https://www.instagram.com/musicconnectz/" rel="me noopener">Instagram</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>

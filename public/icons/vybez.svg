<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-vybe" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lens magnifier glass -->
  <circle cx="85" cy="85" r="45" fill="none" stroke="#00ffff" stroke-width="3" filter="url(#glow-vybe)"/>
  <line x1="120" y1="120" x2="150" y2="150" stroke="#00ffff" stroke-width="3" filter="url(#glow-vybe)"/>

  <!-- Filter symbols inside lens -->
  <!-- Heart (love vibe) -->
  <path d="M75 70 Q70 65, 65 65 Q60 65, 60 70 Q60 75, 75 85 Q90 75, 90 70 Q90 65, 85 65 Q80 65, 75 70"
        fill="#ff00ff" filter="url(#glow-vybe)"/>

  <!-- Location pin (distance) -->
  <path d="M95 75 Q95 65, 105 65 Q115 65, 115 75 Q115 85, 105 95 Q95 85, 95 75"
        fill="none" stroke="#ffff00" stroke-width="1.5" filter="url(#glow-vybe)"/>

  <!-- Wave (music/vibe) -->
  <path d="M70 100 Q75 95, 80 100 Q85 105, 90 100"
        fill="none" stroke="#00ff00" stroke-width="2" filter="url(#glow-vybe)"/>
</svg>

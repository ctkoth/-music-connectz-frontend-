<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Full Body">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="core"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="bloom"/>
      <feMerge><feMergeNode in="bloom"/><feMergeNode in="core"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#0a0810" stroke="#00ff88" stroke-width="2" stroke-opacity="0.4"/>
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="45" r="12" fill="none" stroke="#00ff88" stroke-width="2"/>
    <!-- Shoulders -->
    <line x1="70" y1="60" x2="130" y2="60" stroke="#22e6ff" stroke-width="3"/>
    <!-- Chest -->
    <path d="M80 65 L80 95 M120 65 L120 95" stroke="#00ff88" stroke-width="3"/>
    <!-- Abs -->
    <line x1="100" y1="75" x2="100" y2="105" stroke="#ff00ff" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Left arm -->
    <line x1="70" y1="65" x2="55" y2="120" stroke="#00ff88" stroke-width="3"/>
    <!-- Right arm -->
    <line x1="130" y1="65" x2="145" y2="120" stroke="#22e6ff" stroke-width="3"/>
    <!-- Left leg -->
    <line x1="85" y1="95" x2="75" y2="160" stroke="#00ff88" stroke-width="3"/>
    <!-- Right leg -->
    <line x1="115" y1="95" x2="125" y2="160" stroke="#22e6ff" stroke-width="3"/>
  </g>
</svg>

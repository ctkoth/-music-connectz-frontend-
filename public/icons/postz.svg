<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-post" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Post/Document background -->
  <rect x="60" y="40" width="80" height="120" rx="5" fill="none" stroke="#00ff00" stroke-width="2.5" filter="url(#glow-post)"/>

  <!-- Text lines -->
  <line x1="70" y1="55" x2="130" y2="55" stroke="#00ffff" stroke-width="1.5" filter="url(#glow-post)"/>
  <line x1="70" y1="65" x2="130" y2="65" stroke="#00ffff" stroke-width="1.5" filter="url(#glow-post)"/>
  <line x1="70" y1="75" x2="125" y2="75" stroke="#00ffff" stroke-width="1.5" filter="url(#glow-post)"/>
  <line x1="70" y1="85" x2="130" y2="85" stroke="#00ffff" stroke-width="1.5" filter="url(#glow-post)"/>
  <line x1="70" y1="95" x2="120" y2="95" stroke="#00ffff" stroke-width="1.5" filter="url(#glow-post)"/>

  <!-- Media indicator (image) -->
  <rect x="70" y="105" width="60" height="30" rx="2" fill="none" stroke="#ff00ff" stroke-width="1.5" filter="url(#glow-post)"/>
  <circle cx="85" cy="115" r="4" fill="none" stroke="#ff00ff" stroke-width="1" filter="url(#glow-post)"/>
  <path d="M95 125 L105 115 L120 130" fill="none" stroke="#ff00ff" stroke-width="1" filter="url(#glow-post)"/>

  <!-- Heart icon (like) -->
  <path d="M145 50 Q140 45, 135 45 Q130 45, 130 50 Q130 55, 145 65 Q160 55, 160 50 Q160 45, 155 45 Q150 45, 145 50"
        fill="#ff3333" filter="url(#glow-post)"/>

  <!-- Share/Expand icon -->
  <path d="M150 80 L140 90 M150 80 L150 70 M150 80 L160 80"
        stroke="#ffff00" stroke-width="1.5" fill="none" filter="url(#glow-post)"/>
</svg>

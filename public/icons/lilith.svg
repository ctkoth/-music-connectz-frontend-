<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow-lilith">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="rgba(20, 0, 40, 0.5)"/>

  <!-- Checklist/Clipboard frame -->
  <rect x="50" y="30" width="100" height="140" rx="8" fill="none" stroke="#ff00ff" stroke-width="3" filter="url(#neon-glow-lilith)"/>

  <!-- Clipboard clip -->
  <rect x="60" y="15" width="80" height="20" rx="4" fill="none" stroke="#ff00ff" stroke-width="2" filter="url(#neon-glow-lilith)"/>
  <line x1="90" y1="15" x2="110" y2="15" stroke="#ff00ff" stroke-width="2" filter="url(#neon-glow-lilith)"/>

  <!-- Checklist items -->
  <g filter="url(#neon-glow-lilith)">
    <!-- Item 1 -->
    <rect x="65" y="50" width="12" height="12" rx="2" fill="none" stroke="#00ffff" stroke-width="2"/>
    <line x1="70" y1="65" x2="120" y2="65" stroke="#00ffff" stroke-width="2"/>

    <!-- Item 2 -->
    <rect x="65" y="85" width="12" height="12" rx="2" fill="none" stroke="#00ffff" stroke-width="2"/>
    <line x1="70" y1="100" x2="120" y2="100" stroke="#00ffff" stroke-width="2"/>

    <!-- Item 3 (checked) -->
    <rect x="65" y="120" width="12" height="12" rx="2" fill="none" stroke="#00ff00" stroke-width="2"/>
    <path d="M 67 126 L 70 130 L 75 123" fill="none" stroke="#00ff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="135" x2="120" y2="135" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>
</svg>
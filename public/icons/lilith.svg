<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow-lilith">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="rgba(40, 0, 40, 0.5)"/>

  <!-- Gamification badge/achievement ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ff00ff" stroke-width="2" filter="url(#neon-glow-lilith)" opacity="0.8"/>

  <!-- XP star center -->
  <g filter="url(#neon-glow-lilith)">
    <!-- Main star -->
    <path d="M 100 55 L 110 80 L 137 80 L 115 98 L 125 123 L 100 105 L 75 123 L 85 98 L 63 80 L 90 80 Z"
          fill="none" stroke="#00ffff" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- XP bar around ring -->
  <g filter="url(#neon-glow-lilith)">
    <path d="M 100 35 A 65 65 0 0 1 160 100" fill="none" stroke="#ffff00" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Streak indicator lines -->
  <g filter="url(#neon-glow-lilith)" opacity="0.6">
    <line x1="140" y1="85" x2="155" y2="75" stroke="#ff00ff" stroke-width="1.5"/>
    <line x1="150" y1="120" x2="162" y2="130" stroke="#00ff00" stroke-width="1.5"/>
    <line x1="70" y1="75" x2="55" y2="65" stroke="#00ffff" stroke-width="1.5"/>
  </g>
</svg>

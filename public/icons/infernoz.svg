<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-inferno" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main flame - center -->
  <path d="M100 160 Q85 140, 85 110 Q85 70, 100 50 Q115 70, 115 110 Q115 140, 100 160"
        fill="none" stroke="#ff0000" stroke-width="3" filter="url(#glow-inferno)"/>

  <!-- Secondary flame - left -->
  <path d="M70 160 Q60 145, 60 115 Q60 80, 75 65 Q80 85, 80 115 Q80 140, 70 160"
        fill="none" stroke="#ff6600" stroke-width="2.5" filter="url(#glow-inferno)"/>

  <!-- Secondary flame - right -->
  <path d="M130 160 Q140 145, 140 115 Q140 80, 125 65 Q120 85, 120 115 Q120 140, 130 160"
        fill="none" stroke="#ff6600" stroke-width="2.5" filter="url(#glow-inferno)"/>

  <!-- Inner highlights -->
  <path d="M100 155 Q92 140, 92 115 Q92 85, 100 70 Q108 85, 108 115 Q108 140, 100 155"
        fill="none" stroke="#ffff00" stroke-width="1.5" opacity="0.8" filter="url(#glow-inferno)"/>

  <!-- Sparks/embers -->
  <circle cx="70" cy="50" r="2" fill="#ffff00" filter="url(#glow-inferno)"/>
  <circle cx="130" cy="55" r="2" fill="#ffff00" filter="url(#glow-inferno)"/>
  <circle cx="85" cy="35" r="1.5" fill="#ff9900" filter="url(#glow-inferno)"/>
  <circle cx="115" cy="40" r="1.5" fill="#ff9900" filter="url(#glow-inferno)"/>
  <circle cx="100" cy="30" r="2" fill="#ffff00" filter="url(#glow-inferno)"/>

  <!-- Energy lines (suggesting motion/heat) -->
  <path d="M50 100 Q45 100, 40 100" stroke="#ff3333" stroke-width="1" opacity="0.6" filter="url(#glow-inferno)"/>
  <path d="M150 100 Q155 100, 160 100" stroke="#ff3333" stroke-width="1" opacity="0.6" filter="url(#glow-inferno)"/>

  <!-- Base glow -->
  <circle cx="100" cy="165" r="25" fill="none" stroke="rgba(255, 100, 0, 0.3)" stroke-width="1"/>
  <circle cx="100" cy="165" r="20" fill="none" stroke="rgba(255, 0, 0, 0.2)" stroke-width="1"/>
</svg>

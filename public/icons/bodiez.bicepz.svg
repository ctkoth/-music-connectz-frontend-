<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Biceps">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="core"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="bloom"/>
      <feMerge><feMergeNode in="bloom"/><feMergeNode in="core"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#0a0810" stroke="#00ff88" stroke-width="2" stroke-opacity="0.4"/>
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bicep -->
    <path d="M60 70 Q50 85 55 110 L75 105" fill="none" stroke="#00ff88" stroke-width="5"/>
    <circle cx="62" cy="85" r="12" fill="none" stroke="#ff00ff" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Right bicep -->
    <path d="M140 70 Q150 85 145 110 L125 105" fill="none" stroke="#22e6ff" stroke-width="5"/>
    <circle cx="138" cy="85" r="12" fill="none" stroke="#ff00ff" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Forearms -->
    <line x1="75" y1="105" x2="70" y2="150" stroke="#00ff88" stroke-width="4"/>
    <line x1="125" y1="105" x2="130" y2="150" stroke="#22e6ff" stroke-width="4"/>
  </g>
</svg>

<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-rap" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Microphone -->
  <rect x="85" y="40" width="30" height="50" rx="4" fill="none" stroke="#ff00ff" stroke-width="2.5" filter="url(#glow-rap)"/>

  <!-- Grille pattern -->
  <line x1="95" y1="45" x2="105" y2="45" stroke="#ff00ff" stroke-width="1" filter="url(#glow-rap)"/>
  <line x1="95" y1="55" x2="105" y2="55" stroke="#ff00ff" stroke-width="1" filter="url(#glow-rap)"/>
  <line x1="95" y1="65" x2="105" y2="65" stroke="#ff00ff" stroke-width="1" filter="url(#glow-rap)"/>
  <line x1="95" y1="75" x2="105" y2="75" stroke="#ff00ff" stroke-width="1" filter="url(#glow-rap)"/>

  <!-- Stand -->
  <line x1="100" y1="90" x2="100" y2="120" stroke="#ffff00" stroke-width="2" filter="url(#glow-rap)"/>
  <ellipse cx="100" cy="125" rx="15" ry="5" fill="none" stroke="#ffff00" stroke-width="2" filter="url(#glow-rap)"/>

  <!-- Sound waves -->
  <path d="M120 60 Q130 60, 135 65" fill="none" stroke="#00ffff" stroke-width="2" filter="url(#glow-rap)"/>
  <path d="M115 50 Q135 50, 145 70" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.7" filter="url(#glow-rap)"/>

  <!-- Beat bars -->
  <rect x="60" y="110" width="3" height="20" fill="#00ff00" filter="url(#glow-rap)"/>
  <rect x="68" y="105" width="3" height="25" fill="#00ff00" filter="url(#glow-rap)"/>
  <rect x="76" y="100" width="3" height="30" fill="#00ff00" filter="url(#glow-rap)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="KeyZ">
  <title>KeyZ</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#1b1136"/>
      <stop offset="55%" stop-color="#0e0b1a"/>
      <stop offset="100%" stop-color="#07060d"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="core"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="bloom"/>
      <feMerge><feMergeNode in="bloom"/><feMergeNode in="core"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="92" fill="none" stroke="#00ff88" stroke-opacity="0.35" stroke-width="4"/>

  <g filter="url(#glow)" stroke-linecap="round">
    <rect x="140" y="200" width="40" height="60" rx="4" fill="none" stroke="#22e6ff" stroke-width="12"/>
    <rect x="190" y="180" width="40" height="80" rx="4" fill="none" stroke="#00ff88" stroke-width="12"/>
    <rect x="240" y="200" width="40" height="60" rx="4" fill="none" stroke="#22e6ff" stroke-width="12"/>
    <rect x="290" y="180" width="40" height="80" rx="4" fill="none" stroke="#00ff88" stroke-width="12"/>
    <rect x="340" y="200" width="40" height="60" rx="4" fill="none" stroke="#22e6ff" stroke-width="12"/>
    <line x1="140" y1="280" x2="380" y2="280" stroke="#00ff88" stroke-width="14"/>
  </g>

  <g font-family="Poppins, system-ui, sans-serif" font-weight="800" letter-spacing="-2">
    <text x="256" y="452" text-anchor="middle" font-size="86" fill="#f4f2ff" filter="url(#glowSoft)">Key<tspan fill="#00ff88">Z</tspan></text>
  </g>
</svg>

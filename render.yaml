services:
  - type: web
    name: music-connectz-backend-v2
    runtime: python
    buildCommand: "bash build.sh"
    # Runs migrate + seed_skillz BEFORE gunicorn (see start.sh). This is what
    # applies new migrations on every deploy — a bare gunicorn command here
    # skips migrations, which leaves tables/columns missing (register/login 500,
    # "no members"). Use `bash` so it works regardless of the file's exec bit.
    startCommand: "bash start.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Fresh database, auto-wired from the `databases:` block below. The
      # Blueprint provisions Postgres and injects its connection string — no
      # manual DATABASE_URL needed. (To reuse an external DB instead, replace
      # this with `sync: false` and set DATABASE_URL by hand.)
      - key: DATABASE_URL
        fromDatabase:
          name: mcz-db-v2
          property: connectionString
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: APPLE_OAUTH_CLIENT_ID
        sync: false

databases:
  # Fresh Postgres for the consolidated backend. NOTE: Render's `free` database
  # is removed ~90 days after creation — switch to a paid plan (`basic-256mb`
  # or higher) before launch so production data isn't dropped.
  - name: mcz-db-v2
    plan: free
    databaseName: mcz
    user: mcz
